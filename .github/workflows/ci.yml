name: CI

on:
  push:
    branches: [dev, production, main, master]
  pull_request:
    branches: [production, main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            grep -viE '^\s*(pybluez|alsaaudio|pyaudio)(==|>=|<=|~=|>|<)?' requirements.txt > requirements.ci.txt || true
            pip install -r requirements.ci.txt
          fi

      - name: Syntax check
        run: python -m compileall -q .

      - name: Run tests if present
        run: |
          if [ -d tests ] || ls -1 test_*.py >/dev/null 2>&1; then
            python -m unittest discover -v
          else
            echo "No tests discovered; skipping test execution."
          fi
